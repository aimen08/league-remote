<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Remote</title>
<link rel="icon" href="/icon.svg">
<style>
  @font-face { font-family: 'Cinzel'; src: url(/fonts/cinzel-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Poppins'; src: url(/fonts/poppins-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Poppins'; src: url(/fonts/poppins-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Inter'; src: url(/fonts/inter-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url(/fonts/inter-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  :root { --gold: #c9ab6f; --gold-title: #dcc48c; --gold-hi: #f2e6c8; --text: #e6e0d4; --muted: #9a9ea0; --teal: #12c9bb; --green: #3ed37e; --red: #e84057; }
  * { box-sizing: border-box; }
  html { background: radial-gradient(120% 80% at 50% 0%, #0b2233, #030c15 70%) fixed, #030c15; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; color: var(--text); font: 400 15px/1.5 'Inter', system-ui, sans-serif; background: url(/art/band.jpg) center bottom / cover no-repeat fixed; }
  .panel { position: relative; width: min(860px, 100%); display: grid; grid-template-columns: auto 1fr; gap: 34px; padding: 30px 34px; background: rgba(5, 16, 27, .88); border: 1px solid rgba(201, 171, 111, .4); box-shadow: 0 20px 50px rgba(0, 0, 0, .6); }
  .panel::before, .panel::after { content: ''; position: absolute; top: -2px; width: 22px; height: 22px; border: 2px solid var(--gold); }
  .panel::before { left: -2px; border-right: 0; border-bottom: 0; }
  .panel::after { right: -2px; border-left: 0; border-bottom: 0; }
  h1 { margin: 0; font: 700 32px/1.1 'Cinzel', Georgia, serif; color: var(--gold-title); letter-spacing: .03em; }
  h2 { display: flex; align-items: center; gap: 12px; margin: 22px 0 10px; font: 700 16px/1 'Cinzel', Georgia, serif; color: var(--gold); letter-spacing: .03em; }
  h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #8a6a33, transparent); }
  .sub { color: var(--muted); margin: 6px 0 0; }
  #qr { width: 280px; height: 280px; padding: 12px; background: #fff; border: 3px solid var(--gold); }
  #qr svg { width: 100%; height: 100%; display: block; }
  .addr { margin-top: 12px; font: 600 14px/1.3 'Inter', sans-serif; color: var(--gold-hi); word-break: break-all; max-width: 280px; }
  .code { margin-top: 6px; color: var(--muted); }
  .code b { font: 700 22px 'Poppins', sans-serif; letter-spacing: .2em; color: var(--gold-hi); }
  select { margin-top: 10px; width: 280px; background: #08141e; color: var(--text); border: 1px solid #4a3a18; padding: 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(201, 171, 111, .14); }
  .row .k { width: 90px; color: var(--muted); }
  .row .v { font-weight: 600; color: var(--gold-hi); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 6px rgba(232, 64, 87, .7); flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px rgba(62, 211, 126, .9); }
  .dot.warn { background: #e8b84a; box-shadow: none; }
  .muted { color: var(--muted); font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  li { padding: 4px 0; color: var(--text); }
  li time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 18px; font-size: 13px; color: var(--muted); }
  @media (max-width: 720px) { .panel { grid-template-columns: 1fr; justify-items: center; } }
</style>
</head>
<body>
<div class="panel">
  <div>
    <div id="qr"></div>
    <div class="addr" id="url"></div>
    <select id="pick" hidden></select>
    <div class="code">Pairing code <b id="key"></b></div>
  </div>
  <div>
    <h1>League Remote</h1>
    <p class="sub">Scan the QR code with your phone's camera (same Wi-Fi), then use "Add to Home Screen". You only scan once.</p>
    <h2>Status</h2>
    <div class="row"><span class="dot" id="league-dot"></span><span class="k">League</span><span class="v" id="league"></span></div>
    <div class="row"><span class="dot" id="phone-dot"></span><span class="k">Phone</span><span class="v" id="phone"></span></div>
    <div class="row"><span class="dot on"></span><span class="k">Settings</span><span class="v" id="settings"></span></div>
    <div class="row"><span class="dot on" id="ver-dot"></span><span class="k">Version</span><span class="v" id="version"></span></div>
    <h2>Recent</h2>
    <ul id="recent"><li class="muted">Nothing yet.</li></ul>
    <p class="foot">League Remote keeps running in the system tray. Right-click its icon to quit.</p>
  </div>
</div>
<script>
  // QR codes are generated on the PC, so this page works without internet.
  const codes = __CODES__;
  const $ = s => document.querySelector(s);
  const pick = $('#pick');
  function draw(i) { $('#url').textContent = codes[i].url; $('#qr').innerHTML = codes[i].svg; }
  if (!codes.length) $('#url').textContent = 'No network found. Connect this PC to Wi-Fi or Ethernet.';
  else {
    if (codes.length > 1) {
      pick.hidden = false;
      codes.forEach((c, i) => pick.add(new Option(c.url.replace(/#.*/, ''), i)));
      pick.onchange = () => draw(Number(pick.value));
    }
    draw(0);
  }
  const PHASES = { None: 'In the client', Lobby: 'In a lobby', Matchmaking: 'In queue', ReadyCheck: 'Match found!', ChampSelect: 'Champ select', InProgress: 'In game', EndOfGame: 'Game over', Loading: 'Client loading…' };
  const UPDATE = { checking: 'checking for updates…', latest: 'up to date', downloading: 'downloading an update…', ready: 'update ready, installs after champ select', installing: 'installing update…', failed: 'update check failed, retrying later', off: 'updates off' };
  async function refresh() {
    try {
      const s = await (await fetch('/local-status', { cache: 'no-store' })).json();
      $('#key').textContent = s.key;
      $('#league-dot').className = 'dot' + (s.league.connected ? ' on' : '');
      $('#league').innerHTML = s.league.connected ? `Connected <span class="muted">· ${s.league.summoner || ''} · ${PHASES[s.league.phase] || s.league.phase}</span>` : 'Not found <span class="muted">· open the League client</span>';
      $('#phone-dot').className = 'dot' + (s.phone.connected ? ' on' : s.phone.ever ? ' warn' : '');
      $('#phone').innerHTML = s.phone.connected ? `Connected <span class="muted">· ${s.phone.ip}</span>` : s.phone.ever ? 'Not connected <span class="muted">· phone asleep or app closed</span>' : 'Waiting <span class="muted">· scan the QR code</span>';
      $('#settings').innerHTML = `Auto-accept ${s.settings.autoAccept ? 'on' : 'off'} <span class="muted">·</span> Lock before timeout ${s.settings.autoLock ? 'on' : 'off'}`;
      const st = s.update?.status;
      $('#version').innerHTML = `v${s.version} <span class="muted">· ${(UPDATE[st] || '').replace('an update', `version ${s.update?.version || ''}`)}</span>`;
      $('#ver-dot').className = 'dot ' + (st === 'failed' ? '' : st === 'ready' || st === 'downloading' || st === 'available' ? 'warn' : 'on');
      $('#recent').innerHTML = s.recent.length ? s.recent.slice().reverse().map(r => `<li><time>${new Date(r.time).toTimeString().slice(0, 5)}</time>${r.text.replace(/</g, '&lt;')}</li>`).join('') : '<li class="muted">Nothing yet.</li>';
    } catch {
      $('#league').textContent = 'League Remote is not running';
      $('#league-dot').className = 'dot';
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
