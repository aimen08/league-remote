<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair your phone</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0e13; color: #e8e2d4; font: 16px/1.5 system-ui, Segoe UI, sans-serif; }
  .card { background: #121a24; border: 1px solid #263445; border-radius: 18px; padding: 32px; text-align: center; max-width: 420px; }
  h1 { margin: 0 0 6px; color: #f0e6d2; font-size: 24px; }
  p { color: #8b98a8; margin: 0 0 20px; }
  #qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; width: 264px; height: 264px; }
  #qr svg { width: 100%; height: 100%; display: block; }
  code { display: block; margin-top: 16px; color: #c8aa6e; word-break: break-all; }
  select { margin-top: 12px; background: #1a2532; color: #e8e2d4; border: 1px solid #263445; border-radius: 8px; padding: 6px; }
</style>
</head>
<body>
<div class="card">
  <h1>Scan with your phone</h1>
  <p>Your phone must be on the same Wi-Fi as this PC. Then use "Add to Home Screen" so it opens like an app.</p>
  <div id="qr"></div>
  <code id="url"></code>
  <select id="pick" hidden></select>
</div>
<script>
  // QR codes are generated on the PC, so this page works without internet.
  const codes = __CODES__;
  const pick = document.getElementById('pick');
  function draw(i) {
    document.getElementById('url').textContent = codes[i].url;
    document.getElementById('qr').innerHTML = codes[i].svg;
  }
  if (!codes.length) document.getElementById('url').textContent = 'No network found. Connect this PC to Wi-Fi or Ethernet.';
  else {
    if (codes.length > 1) {
      pick.hidden = false;
      codes.forEach((c, i) => pick.add(new Option(c.url.replace(/#.*/, ''), i)));
      pick.onchange = () => draw(Number(pick.value));
    }
    draw(0);
  }
</script>
</body>
</html>
